<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{subject}</title>
  </head>
  <!-- Table layout + inline styles: many email clients strip <style> blocks
       and none of the majors agree on flexbox, so everything that must not
       break is inlined. -->
  <body style="margin: 0; padding: 0; background-color: #eef1f7">
    <!-- preheader: shows next to the subject in inbox previews, invisible in the body -->
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      {preheader}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #eef1f7">
      <tr>
        <td align="center" style="padding: 28px 12px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 600px; max-width: 100%">
            <!-- header -->
            <tr>
              <td bgcolor="#14161d" style="background-color: #14161d; border-radius: 14px 14px 0 0; padding: 18px 28px">
                <img src="https://app.dracker.sh/email/logo.png" width="120" alt="{app_name}" style="display: block; border: 0; height: auto" />
              </td>
            </tr>

            <!-- body -->
            <tr>
              <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 28px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #1b2235">
                {content}

                <!-- bulletproof button -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 22px 0 6px">
                  <tr>
                    <td bgcolor="#5c9bfb" style="background-color: #5c9bfb; border-radius: 10px">
                      <a href="{link}" style="display: inline-block; padding: 13px 30px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; color: #ffffff; text-decoration: none">{link_lbl}</a>
                    </td>
                  </tr>
                </table>

                {below}
              </td>
            </tr>

            <!-- footer -->
            <tr>
              <td style="border-radius: 0 0 14px 14px; background-color: #f5f7fb; border-top: 1px solid #e3e8f2; padding: 18px 28px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; line-height: 1.6; color: #8b93a5">
                {footer_note}<br />
                &copy; {year} {app_name}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
